packages:
  - apps/*
  - packages/*

# Overrides pull transitive dependencies up to the first version without a
# published advisory. Keep them at the lowest safe floor (patch/minor only) so
# they close the advisory without forcing a major on the tool that depends on
# the package. Re-check with `pnpm audit` after every lockfile refresh.
overrides:
  fast-uri: "^3.1.5"
  sharp: "^0.35.0"
  postcss: "^8.5.23"
  nanoid: "^3.3.17"
  hono: "^4.12.34"
  "@hono/node-server@1": "^1.19.13"
  valibot: "^1.4.2"
  esbuild: "^0.28.1"
  "js-yaml@4": "^4.3.1"
  "@nestjs/swagger>js-yaml": "^5.2.2"
  "brace-expansion@1": "^1.1.18"
  "minimatch@^10>brace-expansion": "^5.0.9"
# Knowingly not overridden — each needs a major bump of a build-time-only
# dependency we do not control, and none is reachable from the running API or
# from a shipped client bundle:
#   image-size  (<=2.0.2, Expo CLI via @expo/image-utils) — 2.x changed exports.
#   uuid        (<11.1.1, Expo prebuild via xcode) — only v3/v5/v6 with `buf`.
#   @hono/node-server (<2.0.5, Prisma CLI dev server) — serve-static is unused.

# @sentry/react-native's Expo config plugin imports this package without
# declaring it. Supply the SDK 57-compatible version for pnpm's isolated
# node_modules layout.
packageExtensions:
  "@sentry/react-native@7.11.0":
    dependencies:
      "@expo/config-plugins": "~57.0.7"

allowBuilds:
  "@prisma/engines": true
  # Telemetry-only postinstall for swagger-ui-dist (@nestjs/swagger dep); no
  # functional purpose, so we don't run it.
  "@scarf/scarf": false
  "@sentry/cli": true
  esbuild: true
  prisma: true
  sharp: true

minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.64.0"
  - "@typescript-eslint/parser@8.64.0"
  - "@typescript-eslint/project-service@8.64.0"
  - "@typescript-eslint/scope-manager@8.64.0"
  - "@typescript-eslint/tsconfig-utils@8.64.0"
  - "@typescript-eslint/type-utils@8.64.0"
  - "@typescript-eslint/types@8.64.0"
  - "@typescript-eslint/typescript-estree@8.64.0"
  - "@typescript-eslint/utils@8.64.0"
  - "@typescript-eslint/visitor-keys@8.64.0"
  - react-native-screens@4.26.1
  - typescript-eslint@8.64.0
  - expo-updates@57.0.7
  - "@expo/cli@57.0.8"
  - "@expo/config-plugins@57.0.5"
  - "@expo/config-types@57.0.2"
  - "@expo/config@57.0.5"
  - "@expo/devtools@57.0.1"
  - "@expo/dom-webview@57.0.1"
  - "@expo/env@2.4.2"
  - "@expo/fingerprint@0.20.5"
  - "@expo/image-utils@0.11.3"
  - "@expo/inline-modules@0.1.3"
  - "@expo/json-file@11.0.1"
  - "@expo/local-build-cache-provider@57.0.4"
  - "@expo/log-box@57.0.1"
  - "@expo/metro-config@57.0.5"
  - "@expo/metro-file-map@57.0.1"
  - "@expo/osascript@2.7.1"
